# Modificado em: 22/09/2026 10:20
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        stages: [manual]
        pass_filenames: false

      - id: ruff-format-check
        name: ruff format --check
        entry: uv run ruff format --check src tests
        language: system
        stages: [manual]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        stages: [manual]
        pass_filenames: false

      - id: ggshield
        name: GitGuardian secret scan
        entry: ggshield secret scan pre-commit
        language: system
        stages: [manual]
        pass_filenames: false
